apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: webapp-staging

resources:
  - ../../base
  - namespace.yaml

labels:
  - pairs:
      environment: staging
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: webapp
    count: 2

images:
  - name: nginx
    newTag: 1.28-alpine

configMapGenerator:
  - name: web-content
    behavior: replace
    files:
      - index.html
