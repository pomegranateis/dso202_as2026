# app-dev.yaml - deploys the Assignment 3 Helm chart (unchanged) as the dev environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/environment: dev
spec:
  project: tasktracker
  source:
    repoURL: https://github.com/pomegranateis/dso202_as2026.git
    targetRevision: main
    path: assignment-3/helm/tasktracker
    helm:
      releaseName: tasktracker
      valueFiles:
        - ../environments/dev.yaml
      # credentials.password is NOT stored in Git. It is set on the live Application with
      #   argocd app set tasktracker-dev -p credentials.password=<password>
      # (see README, Section 5). Until then the chart refuses to render, by design.
  destination:
    server: https://kubernetes.default.svc
    namespace: tasktracker-gitops-dev
  syncPolicy:
    automated:
      prune: true     # delete what was removed from Git
      selfHeal: true  # undo manual kubectl edits
    syncOptions:
      - CreateNamespace=true
