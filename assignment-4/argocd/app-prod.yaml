# app-prod.yaml - deploys the Assignment 3 Helm chart (unchanged) as the prod environment.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tasktracker-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tasktracker
    app.kubernetes.io/environment: prod
spec:
  project: tasktracker
  source:
    repoURL: https://github.com/pomegranateis/dso202_as2026.git
    targetRevision: main
    path: assignment-3/helm/tasktracker
    helm:
      releaseName: tasktracker
      valueFiles:
        - ../environments/prod.yaml
      # credentials.password is NOT stored in Git. It is set on the live Application with
      #   argocd app set tasktracker-prod -p credentials.password=<password>
      # (see README, Section 5). Until then the chart refuses to render, by design.
  destination:
    server: https://kubernetes.default.svc
    namespace: tasktracker-gitops-prod
  syncPolicy:
    # prod is synced by hand (argocd app sync tasktracker-prod) after dev is checked.
    syncOptions:
      - CreateNamespace=true
