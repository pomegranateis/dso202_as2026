{{- $password := required "credentials.password is required (pass -f helm/secrets-local.yaml)" .Values.credentials.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  # The backend and the official Postgres image expect different variable names (see Assignment 1, Task 2).
  DB_USER: {{ .Values.credentials.username | quote }}
  DB_PASSWORD: {{ $password | quote }}
  POSTGRES_USER: {{ .Values.credentials.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
