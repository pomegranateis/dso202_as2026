{{- if .Values.rbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-viewer
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: readonly-role
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: readonly-binding
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: readonly-viewer
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: readonly-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
