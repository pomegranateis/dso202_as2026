apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tasktracker.labels" . | nindent 8 }}
        tier: frontend
      annotations:
        # BACKEND_URL is rendered into config.js at container start, so a config change must restart the frontend too.
        {{- include "tasktracker.configChecksum" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "tasktracker.image" (dict "root" . "name" "frontend") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
    tier: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "tasktracker.selectorLabels" (dict "root" . "tier" "frontend") | nindent 4 }}
  ports:
    - port: 8080
      targetPort: 8080
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
