# environments/prod.yaml - overrides for the production release.
environment: prod
frontend:
  replicaCount: 2
  service:
    nodePort: 30280
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
backend:
  replicaCount: 2
  resources:
    requests: {cpu: 150m, memory: 192Mi}
    limits: {cpu: 400m, memory: 384Mi}
config:
  backendUrl: http://prod.tasktracker.local:8081
  corsOrigin: http://prod.tasktracker.local:8081
ingress:
  enabled: true
  host: prod.tasktracker.local
