apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-deployment
  labels:
    tier: database
spec:
  replicas: 1
  # Recreate: a rolling update would briefly run two Postgres Pods on the same RWO volume
  strategy:
    type: Recreate
  selector:
    matchLabels:
      tier: database
  template:
    metadata:
      labels:
        tier: database
    spec:
      containers:
        - name: db
          image: sarojsanyasi/dso202-db:1.0
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: db-pvc
