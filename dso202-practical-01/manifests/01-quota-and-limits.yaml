apiVersion: v1
kind: ResourceQuota
metadata:
  name: dso202-quota
  namespace: dso202-practical
  labels:
    dso202/practical: "01"
    dso202/managed-by: declarative
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "20"
    count/services: "5"
    count/configmaps: "10"
    count/secrets: "10"

---

apiVersion: v1
kind: LimitRange
metadata:
  name: dso202-limits
  namespace: dso202-practical
  labels:
    dso202/practical: "01"
    dso202/managed-by: declarative
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      min:
        cpu: 10m
        memory: 16Mi
      max:
        cpu: "1"
        memory: 512Mi