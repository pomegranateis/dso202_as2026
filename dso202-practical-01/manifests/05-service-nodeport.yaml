apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: dso202-practical
  labels:
    app: web
    tier: frontend
    dso202/practical: "01"
    dso202/managed-by: declarative
spec:
  type: NodePort
  selector:
    app: web
    tier: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP